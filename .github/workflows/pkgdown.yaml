name: pkgdown

on:
  push: { branches: [main, master] }

# Apenas constroi e valida o site. A publicacao e feita pelo GitHub Pages a
# partir de main:/docs (Deploy from a branch); este workflow nao faz deploy.
permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: |
            any::pkgdown
            local::.

      - name: Check site configuration
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      # Constroi num diretorio temporario do runner: nada e commitado nem publicado.
      - name: Build site (validation only)
        run: pkgdown::build_site(new_process = FALSE, install = TRUE, override = list(destination = file.path(tempdir(), "site")))
        shell: Rscript {0}
